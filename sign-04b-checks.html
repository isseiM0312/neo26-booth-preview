<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>NEO26 ④b 目利きチェック 940×900mm</title>
<link rel="stylesheet" href="sign-common.css">
<style>
  @page { size: 940mm 900mm; margin: 0; }
  .board { width: 940mm; height: 900mm; }

  #band-top { top: 0; height: 10mm; }

  #eyebrow {
    left: 48mm; top: 28mm; right: 48mm;
    font-size: 18mm; color: var(--sky); letter-spacing: 0.04em;
  }
  #title {
    left: 48mm; top: 58mm; right: 48mm;
    font-size: 40mm; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em;
  }
  #title .bar {
    display: inline-block; width: 10mm; height: 36mm;
    background: var(--sky); border-radius: 2mm;
    margin-right: 14mm; vertical-align: -2mm;
  }
  #sub {
    left: 72mm; top: 112mm; right: 48mm;
    font-size: 17mm; color: var(--dim);
  }

  .chk {
    position: absolute; left: 48mm; width: 844mm; height: 118mm;
    background: var(--card); border: 0.8mm solid var(--line); border-radius: 10mm;
  }
  .chk .n {
    position: absolute; left: 24mm; top: 18mm;
    font-size: 18mm; font-weight: 700; color: var(--sky);
  }
  .chk .k {
    position: absolute; left: 24mm; top: 44mm;
    font-size: 30mm; font-weight: 800;
  }
  .chk .v {
    position: absolute; left: 200mm; right: 24mm; top: 40mm;
    font-size: 20mm; color: var(--dim); line-height: 1.35;
  }

  #closer {
    left: 48mm; top: 700mm; width: 844mm; height: 140mm;
    background: #0f2042; border: 0.8mm solid #264682; border-radius: 10mm;
  }
  #closer .a {
    position: absolute; left: 28mm; right: 28mm; top: 28mm;
    font-size: 30mm; font-weight: 800; line-height: 1.25;
  }
  #closer .b {
    position: absolute; left: 28mm; right: 28mm; top: 90mm;
    font-size: 18mm; color: #b0c8f0;
  }

  #meta {
    position: absolute; left: 48mm; bottom: 14mm; right: 48mm;
    font-size: 12mm; color: #5a6575;
    display: flex; justify-content: space-between;
  }
</style>
</head>
<body>

<div class="toolbar noprint">
  <b>④b 4観点</b> 940×900mm · 床上1200〜2100
  <button onclick="setZoom('fit')">画面に合わせる</button>
  <button onclick="setZoom(0.4)">40%</button>
  <button onclick="setZoom(1)">実寸 100%</button>
  <button onclick="document.getElementById('g').classList.toggle('on')">ガイド表示</button>
  <button onclick="print()">PDFに保存</button>
</div>

<div class="stage">
<div class="board" id="board" data-w="940" data-h="900">

  <div class="band" id="band-top"></div>

  <div class="layer eyebrow" id="eyebrow">金／赤を見分ける</div>
  <div class="layer" id="title"><span class="bar"></span>目利きチェック · 4観点</div>
  <div class="layer" id="sub">その場で一緒に振り分けます。</div>

  <div class="chk" style="top:160mm">
    <div class="n">A</div>
    <div class="k">データ</div>
    <div class="v">構造化・文書中心／検索が特定ソースに集中</div>
  </div>
  <div class="chk" style="top:292mm">
    <div class="n">B</div>
    <div class="k">ユーザー</div>
    <div class="v">恩恵を受ける人が明確で少数（高リテラシ層から）</div>
  </div>
  <div class="chk" style="top:424mm">
    <div class="n">C</div>
    <div class="k">リターン</div>
    <div class="v">コスト／売上インパクト大 × 代替割合が高い</div>
  </div>
  <div class="chk" style="top:556mm">
    <div class="n">D</div>
    <div class="k">技術</div>
    <div class="v">軽く試せて、結果を定量で測れる</div>
  </div>

  <div class="layer" id="closer">
    <div class="a">その課題、金ですか。赤ですか。</div>
    <div class="b">スタッフがその場で一緒に見極めます。</div>
  </div>

  <div id="meta">
    <span>④b 940×900mm · 南壁内側・ロゴ下・右</span>
    <span>床上 1200〜2100mm</span>
  </div>
  <div class="guides" id="g"><div class="safe"></div><div class="center"></div></div>
</div>
</div>

<script>
const PX_PER_MM = 96 / 25.4;
function setZoom(mode) {
  const b = document.getElementById("board");
  const w = Number(b.dataset.w) * PX_PER_MM;
  const h = Number(b.dataset.h) * PX_PER_MM;
  b.style.zoom = mode === "fit"
    ? Math.min((innerWidth - 40) / w, (innerHeight - 40) / h)
    : mode;
}
window.setZoom = setZoom;
const raster = new URLSearchParams(location.search).get("raster");
if (raster && raster !== "print") {
  document.documentElement.classList.add("raster");
  document.getElementById("board").style.zoom =
    Number(raster) / (Number(document.getElementById("board").dataset.w) * PX_PER_MM);
} else {
  setZoom("fit");
  addEventListener("resize", () => setZoom("fit"));
}
</script>
</body>
</html>
