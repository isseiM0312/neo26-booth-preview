<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>NEO26 ④b 目利きチェック 940×1600mm</title>
<link rel="stylesheet" href="sign-common.css">
<style>
  @page { size: 940mm 1600mm; margin: 0; }
  .board { width: 940mm; height: 1600mm; }

  #band-top { top: 0; height: 12mm; }

  #eyebrow {
    left: 56mm; top: 40mm; right: 56mm;
    font-size: 22mm; color: var(--sky); letter-spacing: 0.04em;
  }
  #title {
    left: 56mm; top: 84mm; right: 56mm;
    font-size: 52mm; font-weight: 800; line-height: 1.25; letter-spacing: -0.02em;
  }
  #title .bar {
    display: inline-block; width: 12mm; height: 48mm;
    background: var(--sky); border-radius: 3mm;
    margin-right: 18mm; vertical-align: -3mm;
  }
  #sub {
    left: 86mm; top: 220mm; right: 56mm;
    font-size: 24mm; color: var(--dim); line-height: 1.45;
  }

  .chk {
    position: absolute; left: 56mm; width: 828mm; height: 220mm;
    background: var(--card); border: 0.8mm solid var(--line); border-radius: 14mm;
  }
  .chk .n {
    position: absolute; left: 32mm; top: 28mm;
    font-size: 24mm; font-weight: 700; color: var(--sky);
  }
  .chk .k {
    position: absolute; left: 32mm; top: 68mm;
    font-size: 44mm; font-weight: 800;
  }
  .chk .v {
    position: absolute; left: 32mm; right: 32mm; top: 132mm;
    font-size: 26mm; color: var(--dim); line-height: 1.4;
  }

  #closer {
    left: 56mm; top: 1320mm; width: 828mm; height: 220mm;
    background: #0f2042; border: 0.8mm solid #264682; border-radius: 14mm;
  }
  #closer .a {
    position: absolute; left: 36mm; right: 36mm; top: 48mm;
    font-size: 36mm; font-weight: 800; line-height: 1.3;
  }
  #closer .b {
    position: absolute; left: 36mm; right: 36mm; top: 140mm;
    font-size: 22mm; color: #b0c8f0; line-height: 1.4;
  }

  #meta {
    position: absolute; right: 28mm; bottom: 18mm;
    font-size: 12mm; color: #5a6575;
  }
</style>
</head>
<body>

<div class="toolbar noprint">
  <b>④b 4観点</b> 940×1600mm · ロゴ下・右
  <button onclick="setZoom('fit')">画面に合わせる</button>
  <button onclick="setZoom(0.3)">30%</button>
  <button onclick="setZoom(1)">実寸 100%</button>
  <button onclick="document.getElementById('g').classList.toggle('on')">ガイド表示</button>
  <button onclick="print()">PDFに保存</button>
</div>

<div class="stage">
<div class="board" id="board" data-w="940" data-h="1600">

  <div class="band" id="band-top"></div>

  <div class="layer eyebrow" id="eyebrow">金／赤を見分ける</div>
  <div class="layer" id="title"><span class="bar"></span>目利きチェック<br>· 4観点</div>
  <div class="layer" id="sub">課題選定で重視する観点。その場で一緒に振り分けます。</div>

  <div class="chk" style="top:320mm">
    <div class="n">A</div>
    <div class="k">データ</div>
    <div class="v">構造化・文書中心／検索が特定ソースに集中</div>
  </div>
  <div class="chk" style="top:560mm">
    <div class="n">B</div>
    <div class="k">ユーザー</div>
    <div class="v">恩恵を受ける人が明確で少数（高リテラシ層から）</div>
  </div>
  <div class="chk" style="top:800mm">
    <div class="n">C</div>
    <div class="k">リターン</div>
    <div class="v">コスト／売上インパクト大 × 代替割合が高い</div>
  </div>
  <div class="chk" style="top:1040mm">
    <div class="n">D</div>
    <div class="k">技術</div>
    <div class="v">軽く試せて、結果を定量で測れる</div>
  </div>

  <div class="layer" id="closer">
    <div class="a">その課題、金ですか。<br>赤ですか。</div>
    <div class="b">スタッフがその場で一緒に見極めます。</div>
  </div>

  <div id="meta">④b 940×1600mm · 南壁内側・ロゴ下・右</div>
  <div class="guides" id="g"><div class="safe"></div><div class="center"></div></div>
</div>
</div>

<script>
const PX_PER_MM = 96 / 25.4;
function setZoom(mode) {
  const b = document.getElementById("board");
  const w = Number(b.dataset.w) * PX_PER_MM;
  const h = Number(b.dataset.h) * PX_PER_MM;
  b.style.zoom = mode === "fit"
    ? Math.min((innerWidth - 40) / w, (innerHeight - 40) / h)
    : mode;
}
window.setZoom = setZoom;
const raster = new URLSearchParams(location.search).get("raster");
if (raster && raster !== "print") {
  document.documentElement.classList.add("raster");
  document.getElementById("board").style.zoom =
    Number(raster) / (Number(document.getElementById("board").dataset.w) * PX_PER_MM);
} else {
  setZoom("fit");
  addEventListener("resize", () => setZoom("fit"));
}
</script>
</body>
</html>
