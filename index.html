<style>

  * { box-sizing:border-box; margin:0; padding:0; }

  a.card { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; transition:.15s; }

  a.card h2 { font-size:17px; margin-bottom:4px; }
  a.card p { font-size:13px; color:var(--muted); }
  .dims { margin-top:28px; font-size:13px; color:var(--muted); line-height:1.7; }
