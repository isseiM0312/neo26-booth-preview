<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>入稿サイン①②③ 位置マップ — 確定プラン</title>
<style>
  :root { --bg:#0c0d10; --panel:#14171c; --line:#2a3038; --text:#e8eaed; --muted:#8b929b; --accent:#6ea0ff; --hot:#f59e0b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Hiragino Sans","Segoe UI",sans-serif; height:100vh; overflow:hidden; }
  #app { display:grid; grid-template-columns:320px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:16px; overflow-y:auto; }
  h1 { font-size:15px; font-weight:700; }
  .sub { color:var(--muted); font-size:11.5px; line-height:1.5; margin:8px 0 14px; }
  .card {
    border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:8px; cursor:pointer; background:#101317;
  }
  .card:hover, .card.active { border-color:var(--accent); background:#152038; }
  .card .n { font-size:22px; font-weight:800; color:var(--hot); line-height:1; margin-bottom:6px; }
  .card b { display:block; font-size:13px; margin-bottom:4px; }
  .card p { font-size:11.5px; color:var(--muted); line-height:1.45; }
  #stage { position:relative; min-width:0; min-height:0; height:100%; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; left:12px; bottom:12px; display:flex; gap:6px; flex-wrap:wrap; }
  #hud button {
    background:rgba(16,19,23,.92); color:var(--text); border:1px solid var(--line);
    border-radius:999px; padding:7px 12px; font-size:11px; cursor:pointer;
  }
  #legend {
    position:absolute; top:12px; left:12px; background:rgba(16,19,23,.92);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12px; line-height:1.5;
  }
  #legend b { color:var(--hot); }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>確定プラン — サイン位置</h1>
    <p class="sub">最終確定。4×6・L字（西＋南）・開口北＋東・AX3ブルー。カードで該当箇所へ。</p>

    <div class="card active" data-id="1">
      <div class="n">①</div>
      <b>タワーサイン（確定）</b>
      <p>北東・グラフィック1面<br>w1030 × h3650<br>北〜東の開口に向ける</p>
    </div>
    <div class="card" data-id="2">
      <div class="n">②</div>
      <b>壁面パネル（確定）</b>
      <p>L字内側・西壁<br>w2310 × h1750<br>床から900mm上がり</p>
    </div>
    <div class="card" data-id="3">
      <div class="n">③</div>
      <b>ロゴ帯（確定）</b>
      <p>L字内側・南壁上部<br>w1960 × h300<br>Wanderlust lockup</p>
    </div>
  </aside>
  <div id="stage">
    <div id="legend"><b>橙ラベル＝入稿面</b><br>グレー壁＝データ不要（黒＋青帯）</div>
    <div id="hud">
      <button data-cam="aerial">俯瞰</button>
      <button data-cam="1">①へ</button>
      <button data-cam="2">②へ</button>
      <button data-cam="3">③へ</button>
    </div>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const BW = 4, BD = 6;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a3038);

const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 80);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x2a3038, 1);
document.querySelector("#stage").appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.15);
key.position.set(6, 12, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.55);
fill.position.set(-4, 5, -3);
scene.add(fill);

function resize() {
  const st = document.querySelector("#stage");
  const w = Math.max(st.clientWidth, 1), h = Math.max(st.clientHeight, 1);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
addEventListener("resize", resize);
resize();
requestAnimationFrame(resize);

const matBlack = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.7 });
const matBlue = new THREE.MeshStandardMaterial({ color: 0x1e4fd6, roughness: 0.5 });
const matCarpet = new THREE.MeshStandardMaterial({ color: 0x1e4fd6, roughness: 0.9 });
const matHall = new THREE.MeshStandardMaterial({ color: 0x3a3f48, roughness: 0.95 });
const matHot = new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xf59e0b, emissiveIntensity: 0.35, roughness: 0.45 });
const matDim = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.75 });

function box(w, h, d, mat, x, y, z, rotY = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.y = rotY;
  scene.add(m);
  return m;
}

function makeLabel(text, color = "#f59e0b") {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 256;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "rgba(0,0,0,0.75)";
  ctx.roundRect(20, 40, 472, 176, 24);
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 8;
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = "bold 120px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(text, 256, 160);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sp.scale.set(1.2, 0.6, 1);
  scene.add(sp);
  return sp;
}

// hall + carpet
{
  const hall = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), matHall);
  hall.rotation.x = -Math.PI / 2;
  hall.position.y = -0.01;
  scene.add(hall);
  const carpet = new THREE.Mesh(new THREE.PlaneGeometry(BW, BD), matCarpet);
  carpet.rotation.x = -Math.PI / 2;
  carpet.position.y = 0.002;
  scene.add(carpet);
}

const WALL_H = 2.7, WALL_T = 0.08;
const westLen = 4.43, southLen = 2.68;
const westZc = BD / 2 - westLen / 2;
const southXc = -BW / 2 + southLen / 2;

// L walls
box(WALL_T, WALL_H, westLen, matBlack, -BW / 2 + WALL_T / 2, WALL_H / 2, westZc);
box(southLen, WALL_H, WALL_T, matBlack, southXc, WALL_H / 2, BD / 2 - WALL_T / 2);
box(WALL_T + 0.01, 0.15, westLen, matBlue, -BW / 2 + WALL_T / 2 - 0.006, WALL_H - 0.075, westZc);
box(southLen, 0.15, WALL_T + 0.01, matBlue, southXc, WALL_H - 0.075, BD / 2 - WALL_T / 2 + 0.006);

// ② wall panel
const panel2 = box(0.04, 1.75, 2.31, matHot, -BW / 2 + WALL_T + 0.04, 0.9 + 1.75 / 2, westZc + 0.1);
const label2 = makeLabel("② 壁面パネル");
label2.position.set(-BW / 2 + 0.8, 2.9, westZc + 0.1);

// ③ logo panel
const panel3 = box(1.96, 0.3, 0.04, matHot, southXc - 0.1, WALL_H - 0.35, BD / 2 - WALL_T - 0.04);
const label3 = makeLabel("③ ロゴパネル");
label3.position.set(southXc - 0.1, WALL_H + 0.55, BD / 2 - 0.6);

// dim non-submit faces hint on south rest
box(southLen * 0.35, 0.5, 0.02, matDim, southXc + southLen * 0.35, 1.5, BD / 2 - WALL_T - 0.02);

// ① tower — graphic size matches final submit (1030×3650)
const tw = 1.03, td = 0.495, th = 3.65;
const tx = BW / 2 - 0.55, tz = -BD / 2 + 1.1, rot = -Math.PI / 4;
box(tw, th, td, matBlack, tx, th / 2, tz, rot);
box(tw + 0.02, 0.15, td + 0.02, matBlue, tx, th - 0.075, tz, rot);
const faceRot = rot + Math.PI;
const faceOff = td / 2 + 0.02;
const face1 = new THREE.Mesh(new THREE.PlaneGeometry(1.03, 3.65), matHot);
face1.position.set(tx + Math.sin(faceRot) * faceOff, th / 2, tz + Math.cos(faceRot) * faceOff);
face1.rotation.y = faceRot;
scene.add(face1);
const label1 = makeLabel("① タワーサイン");
label1.position.set(tx + 0.3, 4.0, tz - 0.3);

// furniture ghosts
box(0.45, 1.0, 0.9, matDim, BW / 2 - 0.45, 0.5, -0.3);
box(0.45, 1.0, 0.9, matDim, BW / 2 - 0.45, 0.5, 0.7);

const targets = {
  aerial: { pos: [6, 7.5, 5.5], look: [0, 1.2, 0] },
  1: { pos: [4.8, 2.2, -4.2], look: [tx, 2.0, tz] },
  2: { pos: [1.2, 1.7, westZc + 0.2], look: [-BW / 2, 1.7, westZc + 0.1] },
  3: { pos: [southXc, 1.8, 1.2], look: [southXc - 0.1, WALL_H - 0.35, BD / 2] },
};

function setCam(id) {
  const t = targets[id];
  camera.position.set(...t.pos);
  controls.target.set(...t.look);
  document.querySelectorAll(".card").forEach((c) => c.classList.toggle("active", c.dataset.id === id));
}

document.querySelectorAll(".card").forEach((c) => {
  c.onclick = () => setCam(c.dataset.id);
});
document.querySelectorAll("#hud button").forEach((b) => {
  b.onclick = () => setCam(b.dataset.cam);
});

setCam("aerial");

function tick() {
  requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
