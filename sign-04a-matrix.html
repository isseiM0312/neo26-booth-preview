<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>NEO26 ④a 会社紹介 940×900mm</title>
<link rel="stylesheet" href="sign-common.css">
<style>
  @page { size: 940mm 900mm; margin: 0; }
  .board { width: 940mm; height: 900mm; }

  /* ④a ロゴ下・左 940×900 / 床上1200〜2100
     上半分(450)＝会社紹介スライド、下半分(450)＝空白 */

  #band-top { top: 0; height: 8mm; }

  #panel-top {
    left: 0; top: 0; width: 940mm; height: 450mm;
    overflow: hidden;
  }
  #panel-top img {
    position: absolute;
    left: 30mm; top: 36mm;
    width: 880mm; height: auto;
    /* ソース ~2.7:1 → 880×326 程度で上半分に収める */
  }

  #panel-bottom {
    left: 0; top: 450mm; width: 940mm; height: 450mm;
    background: var(--ink);
  }

  #split {
    left: 40mm; top: 450mm; width: 860mm; height: 0.6mm;
    background: #1a212c;
  }

  #meta {
    position: absolute; left: 40mm; right: 40mm; bottom: 18mm;
    font-size: 12mm; color: #5a6575;
    display: flex; justify-content: space-between;
  }
  #blank-note {
    position: absolute; left: 0; top: 620mm; width: 940mm;
    text-align: center; font-size: 16mm; color: #3a4454;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<div class="toolbar noprint">
  <b>④a 会社紹介</b> 940×900mm · 上半分コンテンツ／下半分空白 · 床上1200〜2100
  <button onclick="setZoom('fit')">画面に合わせる</button>
  <button onclick="setZoom(0.4)">40%</button>
  <button onclick="setZoom(1)">実寸 100%</button>
  <button onclick="document.getElementById('g').classList.toggle('on')">ガイド表示</button>
  <button onclick="print()">PDFに保存</button>
</div>

<div class="stage">
<div class="board" id="board" data-w="940" data-h="900">

  <div class="band" id="band-top"></div>

  <div class="layer" id="panel-top">
    <img src="parts/about-wanderlust.png" alt="株式会社Wanderlustについて">
  </div>

  <div class="layer" id="panel-bottom"></div>
  <div class="layer" id="split"></div>
  <div class="layer" id="blank-note">（下半分 · 空白）</div>

  <div id="meta">
    <span>④a 940×900mm · 南壁内側・ロゴ下・左 · 上半分＝会社紹介</span>
    <span>床上 1200〜2100mm</span>
  </div>

  <div class="guides" id="g"><div class="safe"></div><div class="center"></div></div>
</div>
</div>

<script>
const PX_PER_MM = 96 / 25.4;
function setZoom(mode) {
  const b = document.getElementById("board");
  const w = Number(b.dataset.w) * PX_PER_MM;
  const h = Number(b.dataset.h) * PX_PER_MM;
  b.style.zoom = mode === "fit"
    ? Math.min((innerWidth - 40) / w, (innerHeight - 40) / h)
    : mode;
}
window.setZoom = setZoom;
const raster = new URLSearchParams(location.search).get("raster");
if (raster && raster !== "print") {
  document.documentElement.classList.add("raster");
  document.getElementById("board").style.zoom =
    Number(raster) / (Number(document.getElementById("board").dataset.w) * PX_PER_MM);
  // ラスタ時は空白メモを消す
  const n = document.getElementById("blank-note");
  if (n) n.style.display = "none";
  const m = document.getElementById("meta");
  if (m) m.style.display = "none";
} else {
  setZoom("fit");
  addEventListener("resize", () => setZoom("fit"));
}
</script>
</body>
</html>
